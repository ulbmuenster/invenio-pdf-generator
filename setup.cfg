[metadata]
name = invenio-pdf-generator
version = attr: invenio_pdf_generator.__version__
description = "Invenio module that generates PDF from jinja2 templates"
long_description = file: README.rst, CHANGES.rst
keywords = invenio pdf
license = MIT
author = University of Münster
author_email = forschungsdaten@uni-muenster.de
platforms = any
url = https://github.com/ulbmuenster/invenio-pdf-generator
classifiers =
    Development Status :: 4 - Beta

[options]
include_package_data = True
packages = find:
python_requires = >=3.9
zip_safe = False
install_requires =
    invenio-base>=1.2.5
    invenio-i18n>=2.1.1
    invenio-mail>=2.2.1
    invenio-notifications>=0.4.0
    invenio-rdm-records[opensearch2]>=11.6.0
    invenio-records>=2.2.2
    invenio-records-resources>=4.17.2
    invenio-users-resources>=5.4.0
    arrow>=1.3.0
    weasyprint>=59.0
    flask_weasyprint>=1.0.0
    marshmallow-utils>=0.8.0
    python-dateutil>=2.8.2
    PyYaml>=6.0.1

[options.extras_require]
tests =
    invenio-app>=1.5.0,<2.0.0
    pytest-invenio>=2.1.0,<3.0.0
    pytest-black>=0.3.0
    sphinx>=4.5.0

[options.entry_points]
invenio_base.apps =
    invenio_pdf_generator = invenio_pdf_generator:InvenioPdfGenerator
invenio_i18n.translations =
    messages = invenio_pdf_generator
# TODO: Edit these entry points to fit your needs.
# invenio_access.actions =
# invenio_admin.actions =
# invenio_assets.bundles =
# invenio_base.api_apps =
# invenio_base.api_blueprints =
# invenio_celery.tasks =
# invenio_db.models =
# invenio_pidstore.minters =
# invenio_records.jsonresolver =

[build_sphinx]
source-dir = docs/
build-dir = docs/_build
all_files = 1

[bdist_wheel]
universal = 1

[pydocstyle]
add_ignore = D401

[isort]
profile=black

[check-manifest]
ignore =
    *-requirements.txt

[tool:pytest]
addopts = --black --isort --pydocstyle --doctest-glob="*.rst" --doctest-modules --cov=invenio_pdf_generator --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml
testpaths = docs tests invenio_pdf_generator

[compile_catalog]
directory = invenio_pdf_generator/translations/
use-fuzzy = True

[extract_messages]
copyright_holder = University of Münster
msgid_bugs_address = forschungsdaten@uni-muenster.de
mapping-file = babel.ini
output-file = invenio_pdf_generator/translations/messages.pot
add-comments = NOTE

[init_catalog]
input-file = invenio_pdf_generator/translations/messages.pot
output-dir = invenio_pdf_generator/translations/

[update_catalog]
input-file = invenio_pdf_generator/translations/messages.pot
output-dir = invenio_pdf_generator/translations/
